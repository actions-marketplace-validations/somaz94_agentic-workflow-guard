# Known AI agent actions and the inputs that decide how much an injected prompt
# can do. A new agent, or a renamed input, is an edit here and not in the code.
#
# power is the default capability: limited, scoped or broad. A pattern is a
# case-insensitive regular expression matched against an input's value.
# read_only_tools lists the tools an allowlist can hold and still count as
# limited: they read, or they post a comment, and none runs code or approves.
#
# run_pattern finds a command-line agent in a `run:` step, and its inputs read the
# script as `run`. A command has no actor check of its own. Its default power
# comes from what the tool does unattended, per its documentation.
#
# limiting_deny lists the tools a deny list must name for the agent to count as
# limited whatever else it allows. config_files are committed files that can
# narrow a wide default, which they do only when config_pattern matches the value of
# their top-level config_key, and the power then drops to scoped and no further.
agents:
  - id: claude
    uses: [anthropics/claude-code-action]
    # Refuses an actor without write access unless wildcard_inputs says otherwise.
    actor_check: true
    power: scoped
    wildcard_inputs: [allowed_non_write_users]
    bot_wildcard_inputs: [allowed_bots]
    full_output_inputs: [show_full_output]
    tool_inputs: [claude_args, settings]
    allowlist_input: claude_args
    allow_settings_input: settings
    limiting_deny: &claude_limiting_deny [Bash, Write, Edit, MultiEdit, NotebookEdit, WebFetch]
    read_only_tools: &claude_read_only
      - Read
      - Glob
      - Grep
      - LS
      - mcp__github_inline_comment__create_inline_comment
      - Bash(gh pr view:*)
      - Bash(gh pr diff:*)
      - Bash(gh pr checks:*)
      - Bash(gh pr comment:*)
      - Bash(gh issue view:*)
      - Bash(gh issue comment:*)
    broad_when:
      - {input: claude_args, pattern: '--dangerously-skip-permissions|bypassPermissions'}
      - {input: settings, pattern: 'bypassPermissions'}

  - id: codex
    uses: [openai/codex-action]
    actor_check: true
    power: scoped
    wildcard_inputs: [allow-users]
    limited_when:
      - {input: sandbox, pattern: '^read-only$'}
      - {input: permission-profile, pattern: 'read-only'}
      - {input: safety-strategy, pattern: '^read-only$'}
    broad_when:
      - {input: safety-strategy, pattern: '^unsafe$'}
      - {input: sandbox, pattern: 'danger-full-access'}
      - {input: codex-args, pattern: 'danger-full-access|dangerously-bypass'}

  - id: gemini
    uses: [google-github-actions/run-gemini-cli, google-gemini/gemini-cli-action]
    actor_check: false
    power: scoped
    settings_input: settings
    read_only_tools:
      - run_shell_command(echo)
      - run_shell_command(cat)
      - run_shell_command(grep)
      - run_shell_command(head)
      - run_shell_command(tail)
      - run_shell_command(gh issue view)
      - run_shell_command(gh issue list)
      - run_shell_command(gh pr view)
      - run_shell_command(gh pr diff)
      - run_shell_command(gh label list)
      - run_shell_command(gh search issues)
    broad_when:
      - {input: gemini_args, pattern: '(^|\s)(--yes|-y|--yolo)(\s|$)'}
      - {input: settings, pattern: '"approval-?mode"\s*:\s*"yolo"'}
    broad_when_env:
      - {input: GEMINI_CLI_AUTO_APPROVE, pattern: '^true$'}

  - id: inference
    uses: [actions/ai-inference, github/ai-inference]
    actor_check: false
    # Without these inputs the model returns text and has no tools.
    power: limited
    scoped_when:
      - {input: copilot-allow-tools, pattern: '.'}
      - {input: enable-github-mcp, pattern: '^true$'}
    broad_when:
      - {input: copilot-allow-tools, pattern: '^(\*|all|true)$|shell\(\*\)'}

  # Same inputs as claude-code-action, without its actor check.
  - id: claude-base
    uses: [anthropics/claude-code-base-action]
    actor_check: false
    power: scoped
    tool_inputs: [claude_args, settings]
    allowlist_input: claude_args
    allow_settings_input: settings
    limiting_deny: *claude_limiting_deny
    read_only_tools: *claude_read_only
    broad_when:
      - {input: claude_args, pattern: '--dangerously-skip-permissions|bypassPermissions'}
      - {input: settings, pattern: 'bypassPermissions'}

  - id: claude-cli
    run_pattern: '(?:claude|(?:npx|bunx|pnpm dlx)\s+(?:-\S+\s+)*@anthropic-ai/claude-code(?:@\S+)?)\s[^\n]*(?:-p|--print)(?:\s|=|$)'
    actor_check: false
    power: scoped
    tool_inputs: [run]
    allowlist_input: run
    limiting_deny: *claude_limiting_deny
    read_only_tools: *claude_read_only
    broad_when:
      - {input: run, pattern: '--dangerously-skip-permissions|bypassPermissions'}

  # `codex exec` runs in a read-only sandbox unless told otherwise.
  - id: codex-cli
    run_pattern: '(?:codex|(?:npx|bunx|pnpm dlx)\s+(?:-\S+\s+)*@openai/codex(?:@\S+)?)\s(?:[^\n]*\s)?(?:exec|e)(?:\s|$)'
    actor_check: false
    power: limited
    scoped_when:
      - {input: run, pattern: 'workspace-write|--full-auto|--approve-for-me'}
    broad_when:
      - {input: run, pattern: 'danger-full-access|--dangerously-bypass-approvals-and-sandbox|--yolo'}

  - id: gemini-cli
    run_pattern: '(?:gemini|qwen|(?:npx|bunx|pnpm dlx)\s+(?:-\S+\s+)*(?:@google/gemini-cli|@qwen-code/qwen-code)(?:@\S+)?)\s[^\n]*(?:-p|--prompt)(?:\s|=|$)'
    actor_check: false
    power: scoped
    broad_when:
      - {input: run, pattern: '(^|\s)(--yes|-y|--yolo)(\s|$)|--approval-mode[ =]yolo'}

  - id: copilot-cli
    run_pattern: '(?:copilot|(?:npx|bunx|pnpm dlx)\s+(?:-\S+\s+)*@github/copilot(?:@\S+)?)\s[^\n]*(?:-p|--prompt)(?:\s|=|$)'
    actor_check: false
    power: scoped
    broad_when:
      - {input: run, pattern: '--allow-all|--yolo'}

  # Most opencode permissions, bash included, default to allow.
  - id: opencode-cli
    run_pattern: '(?:opencode|(?:npx|bunx|pnpm dlx)\s+(?:-\S+\s+)*opencode-ai(?:@\S+)?)\s+run(?:\s|$)'
    actor_check: false
    power: broad
    config_files: [opencode.json, opencode.jsonc, .opencode/opencode.json, .opencode/opencode.jsonc]
    config_key: permission
    config_pattern: '^"(?:deny|ask)"$|"bash"\s*:\s*(?:"(?:deny|ask)"|\{[^}]*"\*"\s*:\s*"(?:deny|ask)")'
    broad_when:
      - {input: run, pattern: '(^|\s)--auto(\s|$)'}
    limited_when_env:
      - {input: OPENCODE_PERMISSION, pattern: '"bash"\s*:\s*\{\s*"\*"\s*:\s*"deny"(?:\s*,\s*"gh (?:(?:issue|pr) (?:view|list|comment|diff|checks)|search \w+)\*?"\s*:\s*"allow")*\s*\}\s*,\s*"webfetch"\s*:\s*"deny"'}
    scoped_when_env:
      - {input: OPENCODE_PERMISSION, pattern: '"bash"\s*:\s*(?:"(?:deny|ask)"|\{[^}]*"\*"\s*:\s*"(?:deny|ask)")'}

  - id: aider-cli
    run_pattern: 'aider\s[^\n]*(?:--message|--message-file|--msg|-m)(?:\s|=)'
    actor_check: false
    power: scoped
    broad_when:
      - {input: run, pattern: '--yes-always|--auto-test|--test-cmd'}

# Context paths holding text written by whoever triggered the run, matched
# against the whole path in lower case. The object name decides which events can
# carry the field. The bare objects cover `toJSON(github.event.issue)`, and `github`
# itself covers `toJSON(github)`.
untrusted_contexts:
  - github
  - github\.event
  - github\.event\.(issue|comment|discussion|pull_request|workflow_run)
  - github\.event\.issue\.(title|body)
  - github\.event\.comment\.body
  - github\.event\.discussion\.(title|body)
  - github\.event\.pull_request\.(title|body|head|head\.ref|head\.label|head\.repo|head\.repo\.(default_branch|description))
  - github\.event\.workflow_run\.(display_title|head_branch|head_commit|head_commit\.message|head_commit\.(author|committer)\.(name|email))
  - github\.head_ref

# A prior step matching this pulls attacker-written text in, so an agent reading
# that step's output or the file it writes is reading the text too.
untrusted_fetch_pattern: 'github\.event_path|GITHUB_EVENT_PATH|github\.event\.workflow_run\.id|context\.payload\.(issue|comment|discussion|pull_request|workflow_run)|gh (issue|pr) (view|diff)|gh api [^\n]*(issues|pulls)/|issues\.(get|listComments)\(|pulls\.(get|listFiles)\('

# An output, env variable or input named like this holds an identifier or a flag,
# not text, even when the step that set it read attacker-written text along the way.
scalar_output_pattern: '(?i)^(is|has|should|can)[_-]|(^|[_-])(sha|oid|number|num|id|count|size|url|exists|base_ref)$'

# A needs or steps output named like this can carry an authorization result. Any
# other output is flow control, and treating it as a gate would hide a finding.
gate_output_pattern: '(?i)(^|[_-]|is|has|can|user|actor)(authori[sz]ed?|authori[sz]ation|authz|allowed|trusted|member|collaborator|admin|maintainer|permissions?|fork|internal|approved|gate|proceed)($|[_-])|^ok$|(auth|authz|perm|access|gate|check)[_-]?ok$|(is|has|can)[_-]?owner$'

# A Bash permission on one of these commands runs arbitrary programs, however
# narrow it reads: `find -exec`, `xargs`, `env`, an interpreter, a build tool.
exec_equivalent_commands:
  - awk
  - bash
  - bun
  - cargo
  - curl
  - deno
  - docker
  - env
  - find
  - git
  - go
  - make
  - node
  - npm
  - npx
  - perl
  - php
  - pip
  - pnpm
  - python
  - python3
  - ruby
  - sed
  - sh
  - sudo
  - tar
  - uv
  - uvx
  - wget
  - xargs
  - yarn
  - zsh

# A Bash permission on a command like this with open-ended arguments also runs
# arbitrary programs: the arguments are the program, or can add one, as `find -exec`,
# awk's `system()` and sed's `e` do. A fixed command with no wildcard stays narrow,
# and so does a runner with its target named, such as `uv run pytest:*`.
exec_argument_pattern: '^(find|awk|sed|xargs|env|sudo|tar)\s|^(python3?|node|perl|ruby|php|bash|sh|zsh|deno|bun)\s+-\w*[ce]\b|^git\s+-c\b|^(deno|bun|uv|npm|pnpm|yarn|go|cargo)\s+(run|eval|exec|x)\s*[:*]|^docker\s+(run|exec)\b|^pnpm\s+dlx\b'

# Prior steps or jobs matching this can enforce authorization at run time, in a
# way an `if:` does not show. Findings behind one are reported as unverified.
authorization_pattern: 'allowed_?[uU]sers|author_association|getCollaboratorPermissionLevel|collaborators/|checkMembership|/members/|check-user-permission|check-actor-permission|action-repository-permission'

# Credential shapes that must never sit in a committed agent config. Matched
# values are never echoed into a finding.
secret_pattern: '(ghp|gho|ghs|ghu)_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|glpat-[A-Za-z0-9_-]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{32,}|AKIA[0-9A-Z]{16}|xox[baprs]-[A-Za-z0-9-]{10,}'
