name: Review fork pull requests
on:
  pull_request_target:
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_args: --yes
          prompt: 'Review this pull request.'
