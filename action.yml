name: Agentic Workflow Guard
description: Audit GitHub Actions workflows that run AI agents for prompt-injection exposure
author: somaz94

branding:
  icon: shield
  color: blue

inputs:
  path:
    description: 'Repository root to scan'
    required: false
    default: '.'
  fail_on:
    description: 'Fail the step on a finding at or above this severity: high, medium, low or none'
    required: false
    default: 'high'
  sarif_file:
    description: 'Write SARIF 2.1.0 to this path, for upload to code scanning. Empty writes nothing'
    required: false
    default: ''
  ignore_rules:
    description: 'Comma-separated rule IDs to skip'
    required: false
    default: ''

outputs:
  findings:
    description: 'Total number of findings'
  high:
    description: 'Number of high-severity findings'
  medium:
    description: 'Number of medium-severity findings'
  low:
    description: 'Number of low-severity findings'
  warnings:
    description: 'Number of warnings about files that could not be audited'
  sarif_file:
    description: 'Path of the SARIF file, empty when none was written'

runs:
  using: docker
  image: Dockerfile
  env:
    INPUT_PATH: ${{ inputs.path }}
    INPUT_FAIL_ON: ${{ inputs.fail_on }}
    INPUT_SARIF_FILE: ${{ inputs.sarif_file }}
    INPUT_IGNORE_RULES: ${{ inputs.ignore_rules }}
